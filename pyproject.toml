[project]
name = "innoferra-eval"
version = "0.1.0"
description = "Innoferra serving test suite: format conformance, quality benchmarks, TPM/load, and bypass-traffic replay for hosted LLM endpoints (MiniMax M3 first)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
]

[project.scripts]
ibench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["third_party/m3_format_check"]
